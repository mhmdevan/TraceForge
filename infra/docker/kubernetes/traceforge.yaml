# Kubernetes manifests for TraceForge (Phase 12, optional orchestration target).
#
# This is the "challenge mode" deployment. It is authored and validated
# (kubectl apply --dry-run=client) but, unlike Compose and Swarm, it is not run
# in the experiment environment because no local cluster (k3d/minikube/kind) is
# present. To run it locally:
#
#   k3d cluster create traceforge
#   # build + import images into the cluster, then:
#   kubectl apply -f infra/docker/kubernetes/traceforge.yaml
#   kubectl -n traceforge port-forward svc/api-gateway 3000:3000
#
# Services communicate through Kubernetes Services (DNS: <name>.<namespace>).
# transaction-service runs 2 replicas with a HorizontalPodAutoscaler.
---
apiVersion: v1
kind: Namespace
metadata:
  name: traceforge
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: traceforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: traceforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traceforge-config
  namespace: traceforge
data:
  OBS_MODE: "none"
  NODE_ENV: "production"
  DATABASE_URL: "postgres://traceforge:traceforge@postgres:5432/traceforge"
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://rabbitmq:5672"
  TRANSACTION_EVENTS_QUEUE: "transaction.events"
  PAYMENT_SERVICE_URL: "http://payment-service:3002"
  TRANSACTION_SERVICE_URL: "http://transaction-service:3001"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: traceforge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: traceforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: traceforge
            - name: POSTGRES_USER
              value: traceforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "traceforge", "-d", "traceforge"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: traceforge
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: traceforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: traceforge
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: traceforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: traceforge
spec:
  selector: { app: rabbitmq }
  ports:
    - port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: traceforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: traceforge-payment-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: traceforge-config
          env:
            - name: PAYMENT_SERVICE_PORT
              value: "3002"
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: traceforge
spec:
  selector: { app: payment-service }
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: traceforge
spec:
  replicas: 2
  selector:
    matchLabels: { app: transaction-service }
  template:
    metadata:
      labels: { app: transaction-service }
    spec:
      containers:
        - name: transaction-service
          image: traceforge-transaction-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: traceforge-config
          env:
            - name: TRANSACTION_SERVICE_PORT
              value: "3001"
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: traceforge
spec:
  selector: { app: transaction-service }
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service
  namespace: traceforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: traceforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-service }
  template:
    metadata:
      labels: { app: worker-service }
    spec:
      containers:
        - name: worker-service
          image: traceforge-worker-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: traceforge-config
          env:
            - name: WORKER_SERVICE_PORT
              value: "3003"
          ports:
            - containerPort: 3003
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: traceforge
spec:
  selector: { app: worker-service }
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: traceforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: traceforge-api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: traceforge-config
          env:
            - name: API_GATEWAY_PORT
              value: "3000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: traceforge
spec:
  selector: { app: api-gateway }
  ports:
    - port: 3000
      targetPort: 3000
