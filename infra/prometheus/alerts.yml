groups:
  - name: traceforge-service-alerts
    rules:
      - alert: TraceForgeHighP95Latency
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.25
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TraceForge service p95 latency is high"
          description: "Service {{ $labels.service }} has p95 latency above 250ms."

      - alert: TraceForgeHttpErrors
        expr: sum by (service) (rate(http_errors_total[1m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TraceForge service is returning HTTP errors"
          description: "Service {{ $labels.service }} is emitting HTTP errors."

      - alert: TraceForgeOtelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "TraceForge OpenTelemetry Collector is down"
          description: "Prometheus cannot scrape the OpenTelemetry Collector exporter."
