global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:3000

  - job_name: transaction-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - transaction-service:3001

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-service:3002

  - job_name: worker-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-service:3003

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: otel-collector-self
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
